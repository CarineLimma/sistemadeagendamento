<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados da Busca</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container mt-5">
    <h2 class="text-center mb-4">Resultados da Busca</h2>
    
    {% if resultados %}
        <div class="list-group">
            {% for c in resultados %}
                <a href="{{ url_for('editar_cliente', id=c.id) }}" class="list-group-item list-group-item-action">
                    {{ c.nome }} - {{ c.email }} - {{ c.telefone }}
                </a>
            {% endfor %}
        </div>
    {% else %}
        <p class="text-center">Nenhum cliente encontrado com este nome.</p>
    {% endif %}
    
    <div class="mt-3 text-center">
        <a href="{{ url_for('clientes') }}" class="btn btn-secondary">Voltar</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
