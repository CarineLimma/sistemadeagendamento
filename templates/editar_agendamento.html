<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Agendamento</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand" href="{{ url_for('index') }}">Agenda</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Alternar navegação">
            <span class="navbar-toggler-icon"></span>
        </button>
        <nav class="navbar navbar-dark bg-dark shadow-sm">
            <div class="container-fluid justify-content-end">
                <form class="d-flex" method="GET" action="{{ url_for('buscar') }}">
                    <input class="form-control me-2" type="search" name="q" placeholder="Buscar..." aria-label="Buscar">
                    <button class="btn btn-outline-light" type="submit">Buscar</button>
                </form>
            </div>
        </nav>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Início</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('clientes') }}">Clientes</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('agendar') }}">Novo Agendamento</a></li>
                <li class="nav-item"><a class="nav-link active" href="{{ url_for('lista_agendamentos') }}">Agendamentos</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('suporte') }}">Suporte</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('treinamento') }}">Treinamento</a></li>
                <li class="nav-item"><a class="nav-link text-danger" href="{{ url_for('logout') }}">Sair</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h2 class="text-center mb-4">Editar Agendamento</h2>
    <div class="card shadow p-4 mx-auto" style="max-width: 600px;">
        <form method="POST">
            <div class="mb-3">
                <label for="titulo" class="form-label">Título</label>
                <input type="text" class="form-control" id="titulo" name="titulo" value="{{ agendamento['titulo'] }}" required>
            </div>
            <div class="mb-3">
                <label for="data" class="form-label">Data</label>
                <input type="date" class="form-control" id="data" name="data" value="{{ agendamento['data'] }}" required>
            </div>
            <div class="mb-3">
                <label for="hora" class="form-label">Hora</label>
                <input type="time" class="form-control" id="hora" name="hora" value="{{ agendamento['hora'] }}" required>
            </div>
            <div class="mb-3">
                <label for="cliente_id" class="form-label">Cliente</label>
                <select class="form-select" id="cliente_id" name="cliente_id" required>
                    {% for c in clientes %}
                        <option value="{{ c['id'] }}" {% if c['id'] == agendamento['cliente_id'] %}selected{% endif %}>{{ c['nome'] }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label for="descricao" class="form-label">Descrição</label>
                <textarea class="form-control" id="descricao" name="descricao">{{ agendamento['descricao'] }}</textarea>
            </div>
            <div class="d-flex justify-content-between">
                <a href="{{ url_for('lista_agendamentos') }}" class="btn btn-secondary">Cancelar</a>
                <div>
                    <button type="submit" class="btn btn-success">Salvar Alterações</button>
                    <a href="{{ url_for('deletar_agendamento', id=agendamento['id']) }}" class="btn btn-danger"
                       onclick="return confirm('Tem certeza que deseja deletar este agendamento?');">Deletar</a>
                </div>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
