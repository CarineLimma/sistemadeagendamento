<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda - SW3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
</head>
<body>
    <div id="sidebar" class="d-none d-lg-block">
        <h5 class="text-center mb-3">Bem Vindo</h5>
        <ul class="list-unstyled ps-3">
            <li><a href="{{ url_for('index') }}" class="nav-link">Início</a></li>
            <li><a href="{{ url_for('clientes') }}" class="nav-link">Clientes</a></li>
            <li><a href="{{ url_for('agendar') }}" class="nav-link">Novo Agendamento</a></li>
            <li><a href="{{ url_for('lista_agendamentos') }}" class="nav-link">Agendamentos</a></li>
            <li><a href="{{ url_for('suporte') }}" class="nav-link">Suporte</a></li>
            <li><a href="{{ url_for('treinamento') }}" class="nav-link">Treinamento</a></li>
            <li><a href="{{ url_for('logout') }}" class="nav-link text-danger">Sair</a></li>
        </ul>
    </div>

    <nav class="navbar navbar-light bg-light px-3 d-lg-none">
        <button class="btn btn-outline-primary me-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasSidebar" aria-controls="offcanvasSidebar">☰</button>
    </nav>

    <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasSidebar" aria-labelledby="offcanvasSidebarLabel">
        <div class="offcanvas-header">
            <h5 id="offcanvasSidebarLabel">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Fechar"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="list-unstyled">
                <li><a href="{{ url_for('index') }}" class="nav-link">Início</a></li>
                <li><a href="{{ url_for('clientes') }}" class="nav-link">Clientes</a></li>
                <li><a href="{{ url_for('agendar') }}" class="nav-link">Novo Agendamento</a></li>
                <li><a href="{{ url_for('lista_agendamentos') }}" class="nav-link">Agendamentos</a></li>
                <li><a href="{{ url_for('suporte') }}" class="nav-link">Suporte</a></li>
                <li><a href="{{ url_for('treinamento') }}" class="nav-link">Treinamento</a></li>
                <li><a href="{{ url_for('logout') }}" class="nav-link text-danger">Sair</a></li>
            </ul>  
        </div>
    </div>

    <div id="content" class="container mt-4">
        <div class="sticky-calendario">
            <h2 class="titulo-calendario">Calendário</h2>
            <form class="d-flex" method="GET" action="{{ url_for('buscar') }}">
                <input class="form-control me-2" type="search" name="q" placeholder="Buscar..." aria-label="Buscar">
                <button class="btn btn-primary" type="submit">Buscar</button>
            </form>
            <a href="{{ url_for('agendar') }}" class="btn btn-success">Adicionar</a>
        </div>
        <div id="calendar"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var calendarEl = document.getElementById('calendar');
            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'pt-br',
                height: 'auto',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                buttonText: {
                    today: 'Hoje',
                    day: 'Dia',
                    week: 'Semana',
                    month: 'Mês',
                    list: 'Lista'
                },
                events: '/get_events'
            });
            calendar.render();
        });
    </script>
</body>
</html>
